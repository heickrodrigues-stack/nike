<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gangue da Nike - Vídeo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <header class="header">
      <h1>Gangue da Nike</h1>
      <p>Assista ao vídeo abaixo</p>
    </header>

    <div class="video-wrapper">
      <video id="main-video" controls poster="https://via.placeholder.com/800x450/1a103c/00e5ff?text=Gangue+da+Nike">
        <source src="seu-video.mp4" type="video/mp4">
        Seu navegador não suporta a tag de vídeo.
      </video>
    </div>

    <div class="actions">
      <button class="btn" id="btn-play">▶️ Play / Pause</button>
      <button class="btn" id="btn-mute">🔇 Mutar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
